# Vercel reads dependencies from here, not from requirements.txt.
# Keep [project].dependencies equal to requirements.txt (tests/test_requirements.py checks it).
[project]
name = "jean-cours-backend"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "pydantic==2.14.3",
    "pymongo==4.19.0",
    "python-dotenv==1.2.4",
]

[tool.vercel]
entrypoint = "jean_cours.api.app:app"
